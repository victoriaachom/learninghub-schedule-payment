
spring:
  flyway:
    locations: classpath:db/migration                    
    ignore-migration-patterns: "*:missing"               
  jpa:
    show-sql: false

lms:
  environment-label: "PROD (from config-service) - Flyway schema only, no seed data, SQL logging off"

logging:
  level:
    root: WARN
    edu.lms: INFO
