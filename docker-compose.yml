# LearningHub - schedule-service and payment-service (Victoria Achom)
#
#   docker compose up --build                  # dev profile (PROFILE in .env)
#   PROFILE=prod docker compose up --build     # prod profile
#   docker compose down -v                     # stop and wipe the database
#   docker compose --profile scale up -d schedule-service-2   # 2nd instance
#   docker compose --profile stress run --rm gatling          # stress test
#
# Entry point: gateway-service on http://localhost:8090 routes /api/schedule/**
# and /api/payments/** to the services it finds in Eureka (discovery-service,
# dashboard on http://localhost:8761).
#
# Security: Keycloak (realm "learninghub", imported from keycloak/) is reached
# through the gateway at http://localhost:8090/auth. Password-reset emails land
# in Mailpit: http://localhost:8025
#
# postgres, config-service and discovery-service must be healthy before the
# business services start, so they receive their profile and can register.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks: [lh-internal]

  config-service:
    build: ./config-service
    ports:
      - "8889:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      retries: 20
    networks: [lh-internal]
    restart: unless-stopped

  # Identity provider: login, tokens, roles, self-registration, forgot-password.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8090/auth      # public address = through the gateway
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin           # admin console: http://localhost:8090/auth/admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/learninghub-realm.json:/opt/keycloak/data/import/learninghub-realm.json:ro
    healthcheck:
      # the image has no curl/wget, so ask for the realm's discovery document over bash /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /auth/realms/learninghub/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q issuer <&3"]
      interval: 10s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lh-internal]
    restart: unless-stopped

  # Fake mail server: catches Keycloak's password-reset emails (inbox UI on 8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks: [lh-internal]

  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      retries: 20
    networks: [lh-internal]
    restart: unless-stopped

  gateway-service:
    build: ./gateway-service
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      ENROLLMENT_URL: http://enrollment-service:8104
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8090:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [lh-internal]
    restart: unless-stopped

  # Dev stand-in for Renae's enrollment-service: fixed JSON in the team API shape.
  enrollment-service:
    image: nginx:1.27-alpine
    volumes:
      - ./stubs/enrollment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stubs/enrollment/html:/usr/share/nginx/html:ro
    ports:
      - "8104:8104"
    networks: [lh-internal]

  schedule-service:
    build: ./schedule-service
    image: learninghub/schedule-service        # shared with schedule-service-2
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/scheduledb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8103
      ENROLLMENT_URL: http://enrollment-service:8104
      EUREKA_ENABLED: "true"      # register with discovery-service
      EUREKA_URL: http://discovery-service:8761/eureka
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/learninghub/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8090/auth/realms/learninghub
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      enrollment-service:
        condition: service_started
    networks: [lh-internal]
    restart: unless-stopped


  # Scalability / resilience demo: a SECOND schedule-service instance (same image,
  # same database). It registers in Eureka under the same name, and the gateway
  # load-balances between the two.  Start it with:
  #   docker compose --profile scale up -d schedule-service-2
  schedule-service-2:
    profiles: ["scale"]
    image: learninghub/schedule-service        # shared with schedule-service-2
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/scheduledb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8103
      ENROLLMENT_URL: http://enrollment-service:8104
      EUREKA_ENABLED: "true"      # register with discovery-service
      EUREKA_URL: http://discovery-service:8761/eureka
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/learninghub/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8090/auth/realms/learninghub
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      enrollment-service:
        condition: service_started
    networks: [lh-internal]
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8107
      ENROLLMENT_URL: http://enrollment-service:8104
      SCHEDULE_URL: http://schedule-service      # Eureka name, resolved by the load balancer
      EUREKA_ENABLED: "true"      # register with discovery-service
      EUREKA_URL: http://discovery-service:8761/eureka
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/learninghub/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8090/auth/realms/learninghub
    ports:
      - "8107:8107"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      enrollment-service:
        condition: service_started
    networks: [lh-internal]
    restart: unless-stopped

  # Gatling stress test through the gateway (HTML report in ./gatling/results).
  #   docker compose --profile stress run --rm gatling
  #   USERS=100 DURATION_SECONDS=90 docker compose --profile stress run --rm gatling
  gatling:
    build: ./gatling
    profiles: ["stress"]
    environment:
      BASE_URL: http://gateway-service:8080
      USERS: ${USERS:-50}
      RAMP_SECONDS: ${RAMP_SECONDS:-20}
      DURATION_SECONDS: ${DURATION_SECONDS:-60}
    volumes:
      - ./gatling/results:/app/target/gatling
    networks: [lh-internal]

networks:
  lh-internal:
    driver: bridge

volumes:
  pgdata:
