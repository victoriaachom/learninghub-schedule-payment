# LearningHub - schedule-service and payment-service (Victoria Achom)
#
#   docker compose up --build                  # dev profile (PROFILE in .env)
#   PROFILE=prod docker compose up --build     # prod profile
#   docker compose down -v                     # stop and wipe the database
#
# Entry point: gateway-service on http://localhost:8090 routes /api/schedule/**
# and /api/payments/** to the services it finds in Eureka (discovery-service,
# dashboard on http://localhost:8761).
#
# postgres, config-service and discovery-service must be healthy before the
# business services start, so they receive their profile and can register.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks: [lh-internal]

  config-service:
    build: ./config-service
    ports:
      - "8889:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      retries: 20
    networks: [lh-internal]
    restart: unless-stopped

  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      retries: 20
    networks: [lh-internal]
    restart: unless-stopped

  gateway-service:
    build: ./gateway-service
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      ENROLLMENT_URL: http://enrollment-service:8104
    ports:
      - "8090:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks: [lh-internal]
    restart: unless-stopped

  # Dev stand-in for Renae's enrollment-service: fixed JSON in the team API shape.
  enrollment-service:
    image: nginx:1.27-alpine
    volumes:
      - ./stubs/enrollment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stubs/enrollment/html:/usr/share/nginx/html:ro
    ports:
      - "8104:8104"
    networks: [lh-internal]

  schedule-service:
    build: ./schedule-service
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/scheduledb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8103
      ENROLLMENT_URL: http://enrollment-service:8104
      EUREKA_ENABLED: "true"      # register with discovery-service
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      enrollment-service:
        condition: service_started
    networks: [lh-internal]
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8107
      ENROLLMENT_URL: http://enrollment-service:8104
      SCHEDULE_URL: http://schedule-service      # Eureka name, resolved by the load balancer
      EUREKA_ENABLED: "true"      # register with discovery-service
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8107:8107"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      enrollment-service:
        condition: service_started
    networks: [lh-internal]
    restart: unless-stopped

networks:
  lh-internal:
    driver: bridge

volumes:
  pgdata:
