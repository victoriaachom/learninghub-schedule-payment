server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Resilience: never wait forever on a slow or dead instance...
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          # ...and retry a failed read on another instance (lb:// picks again on each try)
          default-filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: SERVER_ERROR
                exceptions: java.io.IOException, org.springframework.cloud.gateway.support.TimeoutException, org.springframework.cloud.gateway.support.NotFoundException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          routes:
            # Keycloak (login, token, registration, forgot-password pages) behind the
            # same single origin: http://localhost:8090/auth/...
            - id: keycloak
              uri: ${KEYCLOAK_URL:http://keycloak:8080}
              predicates:
                - Path=/auth/**
            # Landing page users return to after signing up or resetting a password
            - id: welcome
              uri: ${ENROLLMENT_URL:http://enrollment-service:8104}
              predicates:
                - Path=/welcome
            # lb:// = look the service up in Eureka and load-balance across its instances
            - id: schedule-service
              uri: lb://schedule-service
              predicates:
                - Path=/api/schedule/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            # The enrollment dev stub is plain nginx and does not register with Eureka,
            # so it is routed by its fixed address. With Renae's real service: lb://enrollment-service
            - id: enrollment-service
              uri: ${ENROLLMENT_URL:http://enrollment-service:8104}
              predicates:
                - Path=/api/enrollment/**
    loadbalancer:
      cache:
        ttl: 5s            # pick up new or stopped instances quickly

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,info,gateway     # GET /actuator/gateway/routes lists the routes
