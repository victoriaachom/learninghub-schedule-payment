# payment-service: settings shared by every profile.
# Profile-specific settings (dev / prod) come from config-service:
#   config-service/src/main/resources/config/payment-service-{dev,prod}.yml
spring:
  application:
    name: payment-service          # gateway routes lb://payment-service here
  config:
    import: optional:configserver:${CONFIG_URL:http://config-service:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/paymentdb}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only checks it matches
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak's public keys, fetched inside Docker (keycloak:8080)
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/auth/realms/learninghub/protocol/openid-connect/certs}
          # tokens are issued for the public address, through the gateway
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8090/auth/realms/learninghub}
  flyway:
    locations: classpath:db/migration   # dev adds classpath:db/seed through config-service

server:
  port: ${SERVER_PORT:8107}
  error:
    include-message: always         # show the reason (e.g. "Not the owner of invoice 3") in error responses

lms:
  enrollment-url: ${ENROLLMENT_URL:http://enrollment-service:8104}
  schedule-url: ${SCHEDULE_URL:http://schedule-service}   # Eureka service name, not host:port
  environment-label: "NO PROFILE CONFIG - config-service was not reachable at startup"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}
    enabled: ${EUREKA_ENABLED:false}    # compose turns this on; off = run standalone
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5    # registers within seconds of starting

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,flyway
