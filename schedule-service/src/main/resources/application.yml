# schedule-service: settings shared by every profile.
# Profile-specific settings (dev / prod) come from config-service:
#   config-service/src/main/resources/config/schedule-service-{dev,prod}.yml
spring:
  application:
    name: schedule-service          # gateway routes lb://schedule-service here
  config:
    import: optional:configserver:${CONFIG_URL:http://config-service:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/scheduledb}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    locations: classpath:db/migration   # dev adds classpath:db/seed through config-service

server:
  port: ${SERVER_PORT:8103}
  error:
    include-message: always         # show the reason (e.g. "Admin only") in error responses

lms:
  enrollment-url: ${ENROLLMENT_URL:http://enrollment-service:8104}
  dev-user: ${LMS_DEV_USER:sstudent}   # used when a request has no X-User header (Phase 1)
  dev-role: ${LMS_DEV_ROLE:student}
  zone: ${LMS_ZONE:America/Phoenix}    # "today" is computed in this time zone
  environment-label: "NO PROFILE CONFIG - config-service was not reachable at startup"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}
    enabled: ${EUREKA_ENABLED:false}    # Phase 2
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,flyway
