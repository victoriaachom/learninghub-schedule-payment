# Dev-only stand-in for enrollment-service (owned by Renae).
# Serves fixed JSON in the shape of the team API spec so schedule-service and
# payment-service can be demonstrated calling their neighbour. Replace with the
# real enrollment-service when it is available.
server {
    listen 8104;

    location = /actuator/health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location /api/enrollment/ {
        default_type application/json;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}
