# Dev-only stand-in for enrollment-service (owned by Renae).
# Serves fixed JSON in the shape of the team API spec so schedule-service and
# payment-service can be demonstrated calling their neighbour. Replace with the
# real enrollment-service when it is available.
server {
    listen 8104;

    location = /actuator/health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # Landing page after Keycloak sign-up / password reset (routed by the gateway as /welcome)
    location = /welcome {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>LearningHub</title></head><body style="font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;text-align:center"><h1>Signed in to LearningHub</h1><p>Keycloak accepted your account and redirected you back through the gateway.</p><p style="color:#666">LearningHub has no front end in this repository; use Postman to call the API with your username and password.</p></body></html>';
    }

    location /api/enrollment/ {
        default_type application/json;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}
